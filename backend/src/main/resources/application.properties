spring.application.name=commit-risk-analyzer

# ---------------------------------------------------------------------------
# Active profile: "dev" uses an in-memory H2 database so the project runs
# immediately with zero setup. Switch to "mysql" (or set SPRING_PROFILES_ACTIVE)
# once you have a MySQL instance ready - see application-mysql.properties.
# ---------------------------------------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# AI provider configuration - all values come from environment variables.
# No API key is ever hardcoded. If AI_API_KEY is not set, the app
# automatically falls back to the rule-based explanation generator.
# ---------------------------------------------------------------------------
ai.enabled=${AI_ENABLED:true}
ai.provider=${AI_PROVIDER:anthropic}
ai.api-key=${AI_API_KEY:}
ai.api-url=${AI_API_URL:https://api.anthropic.com/v1/messages}
ai.model=${AI_MODEL:claude-sonnet-4-6}
ai.timeout-ms=${AI_TIMEOUT_MS:15000}

# ---------------------------------------------------------------------------
# Risk scoring model - override any of these via environment variables to
# tune the engine without touching Java code, e.g. RISK_SECURITYPOINTS=25
# ---------------------------------------------------------------------------
risk.large-change-line-threshold=${RISK_LARGE_CHANGE_LINE_THRESHOLD:300}
risk.medium-change-line-threshold=${RISK_MEDIUM_CHANGE_LINE_THRESHOLD:100}
risk.large-change-points=${RISK_LARGE_CHANGE_POINTS:15}
risk.medium-change-points=${RISK_MEDIUM_CHANGE_POINTS:8}
risk.many-files-threshold=${RISK_MANY_FILES_THRESHOLD:6}
risk.several-files-threshold=${RISK_SEVERAL_FILES_THRESHOLD:3}
risk.many-files-points=${RISK_MANY_FILES_POINTS:10}
risk.several-files-points=${RISK_SEVERAL_FILES_POINTS:5}
risk.database-points=${RISK_DATABASE_POINTS:15}
risk.security-points=${RISK_SECURITY_POINTS:20}
risk.payment-points=${RISK_PAYMENT_POINTS:20}
risk.api-points=${RISK_API_POINTS:10}
risk.exception-handling-points=${RISK_EXCEPTION_HANDLING_POINTS:10}
risk.configuration-points=${RISK_CONFIGURATION_POINTS:10}
risk.auth-points=${RISK_AUTH_POINTS:15}
risk.low-max=${RISK_LOW_MAX:30}
risk.medium-max=${RISK_MEDIUM_MAX:60}
risk.high-max=${RISK_HIGH_MAX:80}

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.error.include-stacktrace=never
