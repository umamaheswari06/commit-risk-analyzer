# Zero-setup local development profile.
# Uses an in-memory H2 database so `mvn spring-boot:run` works immediately
# with no external database required. Data resets on every restart.

spring.datasource.url=jdbc:h2:mem:commitrisk;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Optional: browse the in-memory DB at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
