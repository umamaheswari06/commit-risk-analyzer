# Production-style profile using MySQL, as specified by the project's tech stack.
# Activate with SPRING_PROFILES_ACTIVE=mysql
#
# 1. Create the database:  CREATE DATABASE commit_risk_analyzer;
# 2. Set the environment variables below (see .env.example).
# 3. Run:  SPRING_PROFILES_ACTIVE=mysql mvn spring-boot:run

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:commit_risk_analyzer}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
